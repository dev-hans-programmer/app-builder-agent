[project]
name = "app-builder-agent"
version = "0.1.0"
description = "Python project builder agent using LangGraph"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.14.0",
    "langchain>=0.3.0",
    "langgraph>=0.2.0",
    "langgraph-checkpoint-postgres>=2.0.0",
    "asyncpg>=0.30.0",
    "celery>=5.5.0",
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "psycopg[binary,pool]>=3.2.0",
    "pydantic-settings>=2.7.0",
    "python-dotenv>=1.0.0",
    "redis>=5.2.0",
    "rich>=13.0.0",
    "openai>=2.45.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "uvicorn[standard]>=0.34.0",
]

[project.optional-dependencies]
dev = [
    "aiosqlite>=0.20.0",
    "pytest>=8.0.0",
    "black>=24.0.0",
    "ruff>=0.6.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
app-builder-api = "src.control_plane.app:run"
app-builder-worker = "src.control_plane.tasks:run_worker"
