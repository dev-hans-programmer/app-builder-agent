services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: app_builder
      POSTGRES_USER: app_builder
      POSTGRES_PASSWORD: app_builder
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - app-builder-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_builder -d app_builder"]
      interval: 2s
      timeout: 3s
      retries: 30

  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: app_builder
      RABBITMQ_DEFAULT_PASS: app_builder
      RABBITMQ_DEFAULT_VHOST: app_builder
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - app-builder-rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - app-builder-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  app-builder-postgres:
  app-builder-rabbitmq:
  app-builder-redis:
